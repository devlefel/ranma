name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./... -race
      # Not `gofmt -l . | tee /dev/stderr | (! read)`: that pipeline is not
      # portable (macOS runners use bash 3.2) and, worse, it hides *which*
      # files are unformatted when it fails.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Arquivos mal formatados:"
            echo "$unformatted"
            exit 1
          fi
